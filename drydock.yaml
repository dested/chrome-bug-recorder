# drydock.yaml — Drydock deploy manifest. Replaces render.yaml.
# Drydock reads this to build, run, and provision your app. Edit here or in
# the portal (portal writes win on the next "Re-commit"). Secrets live in the
# portal (SSM), never in this file.
name: gripe
kind: ssr          # ssr | static
runtime: bun        # bun | node
port: 3000
memory: 256        # MiB soft reservation
rootDir: landing       # app lives in this repo subdirectory
build: bun run build
start: bun run start
database: false      # provision Postgres + DATABASE_URL
prisma: false        # prisma generate on build, db push predeploy
domains:
  - gripe.dested.com
dnsZone: dested.com
